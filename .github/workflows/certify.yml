name: Certification
on: {workflow_dispatch: {}}
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install --ignore-scripts
      - run: npm run certify
      - run: |
          mkdir -p artifacts
          printf '# Mobile Certification\n\n- Exact SHA: %s\n- Platform: Expo React Native\n- Result: passed\n' "$GITHUB_SHA" > artifacts/certification-summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: certification-${{ github.sha }}
          path: artifacts/certification-summary.md
