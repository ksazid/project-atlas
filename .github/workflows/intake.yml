name: Product intake
on:
  pull_request:
    paths: ["product/**", "security/**", "delivery/**", "planning/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm run planning:validate
      - run: npm run product:intake
