name: Temporary VS-21 regression fix

"on":
  push:
    branches:
      - atlas/expo-go-test-harness
    paths:
      - .github/workflows/tmp-vs21-regression-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: atlas/expo-go-test-harness
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused regressions
        run: python3 .github/tmp-vs21-fix.py
      - name: Run focused mobile regression tests
        run: npm run mobile:test
      - name: Run API tests
        run: dotnet test tests/api/Atlas.Api.Tests.csproj --configuration Release
      - name: Commit verified fixes
        shell: bash
        run: |
          rm .github/workflows/tmp-vs21-regression-fix.yml .github/tmp-vs21-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/app/create-business.tsx apps/api/BusinessDiscovery.cs tests/api/BusinessDiscoveryPolicyTests.cs .github/workflows/tmp-vs21-regression-fix.yml .github/tmp-vs21-fix.py
          git commit -m "fix(vs21): neutralize source branding and bound large page reads"
          git push origin HEAD:atlas/expo-go-test-harness
